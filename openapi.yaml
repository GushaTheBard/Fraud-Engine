openapi: 3.1.0
info:
  title: Real-Time Fraud Prevention & Velocity Check API
  version: 1.0.0
  description: |
    Ultra-low-latency synchronous decision API for real-time fraud scoring,
    dynamic rule evaluation, Shadow Mode testing, and sliding-window velocity checks.
  contact:
    name: Mauro Horie

servers:
  - url: http://localhost:8080/v1
    description: Local Development Server

tags:
  - name: Evaluation
    description: Real-time transaction and event risk scoring
  - name: Rules
    description: Dynamic lifecycle management of static and velocity rules
  - name: Simulation
    description: Historical backtesting for proposed fraud rules

paths:
  /evaluate:
    post:
      tags:
        - Evaluation
      summary: Evaluate an event in real time
      description: |
        Evaluates an incoming event against active and shadow rules, enriches context
        with Redis sliding-window velocity counters, and returns a deterministic decision
        (`ALLOW`, `CHALLENGE`, or `BLOCK`).
      operationId: evaluateEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRequest'
            examples:
              highValuePix:
                summary: High-value PIX transaction
                value:
                  event_id: "evt_987654321"
                  event_type: "TRANSACTION"
                  user_id: "usr_102938"
                  ip_address: "189.45.120.14"
                  device_id: "dev_abc123xyz"
                  amount: 6500.00
                  currency: "BRL"
                  country: "BR"
                  timestamp: "2026-11-17T23:30:00Z"
      responses:
        '200':
          description: Risk evaluation completed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateResponse'
              examples:
                challengeDecision:
                  summary: Transaction flagged for step-up authentication
                  value:
                    event_id: "evt_987654321"
                    decision: "CHALLENGE"
                    risk_score: 55
                    triggered_rules:
                      - code: "HIGH_AMOUNT_BRL"
                        weight: 35
                        description: "Transaction amount exceeds R$ 5,000.00"
                      - code: "VELOCITY_IP_5M"
                        weight: 20
                        description: "More than 3 events from the same IP in 5 minutes"
                    shadow_triggered_rules:
                      - "NEW_DEVICE_HIGH_VALUE"
                    degraded_mode: false
                    evaluation_time_ms: 4.2
        '400':
          description: Invalid event payload
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /rules:
    get:
      tags:
        - Rules
      summary: List all configured rules
      operationId: listRules
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/RuleStatus'
      responses:
        '200':
          description: List of rules retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Rule'

    post:
      tags:
        - Rules
      summary: Create a new fraud rule
      description: |
        Creates a static or velocity-based rule. Propagates cache invalidation
        across all running instances via Redis Pub/Sub within 1 second.
      operationId: createRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRuleRequest'
            examples:
              velocityRule:
                summary: Card testing velocity rule
                value:
                  code: "VELOCITY_IP_5M"
                  name: "Rapid attempts per IP"
                  description: "Flags more than 3 transactions from the same IP within 5 minutes"
                  type: "VELOCITY"
                  status: "ACTIVE"
                  weight: 45
                  condition:
                    field: "event_count"
                    operator: ">"
                    value: 3
                  velocity_config:
                    group_by: "ip_address"
                    window_seconds: 300
      responses:
        '201':
          description: Rule created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '400':
          description: Validation error in rule definition
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /rules/{ruleId}/status:
    patch:
      tags:
        - Rules
      summary: Update rule lifecycle status
      description: Toggle a rule between `ACTIVE`, `SHADOW`, and `INACTIVE` without redeploying.
      operationId: updateRuleStatus
      parameters:
        - name: ruleId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  $ref: '#/components/schemas/RuleStatus'
      responses:
        '200':
          description: Rule status updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
        '404':
          description: Rule not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /rules/simulate:
    post:
      tags:
        - Simulation
      summary: Backtest a proposed rule against historical events
      description: |
        Evaluates a candidate rule against the most recent N stored decision logs
        to measure false-positive impact before promoting the rule to `SHADOW` or `ACTIVE`.
      operationId: simulateRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SimulateRuleRequest'
      responses:
        '200':
          description: Backtesting simulation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulateRuleResponse'

components:
  schemas:
    DecisionAction:
      type: string
      enum:
        - ALLOW
        - CHALLENGE
        - BLOCK

    RuleStatus:
      type: string
      enum:
        - ACTIVE
        - SHADOW
        - INACTIVE

    RuleType:
      type: string
      enum:
        - STATIC
        - VELOCITY

    Operator:
      type: string
      enum:
        - "=="
        - "!="
        - ">"
        - ">="
        - "<"
        - "<="
        - IN
        - NOT_IN

    EvaluateRequest:
      type: object
      required:
        - event_id
        - event_type
        - user_id
        - ip_address
        - timestamp
      properties:
        event_id:
          type: string
          example: "evt_987654321"
        event_type:
          type: string
          enum: [TRANSACTION, LOGIN, SIGNUP]
        user_id:
          type: string
          example: "usr_102938"
        ip_address:
          type: string
          format: ipv4
          example: "189.45.120.14"
        device_id:
          type: string
          example: "dev_abc123xyz"
        amount:
          type: number
          format: double
          minimum: 0
          example: 6500.00
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: "BRL"
        country:
          type: string
          minLength: 2
          maxLength: 2
          example: "BR"
        timestamp:
          type: string
          format: date-time

    TriggeredRuleDetail:
      type: object
      required:
        - code
        - weight
        - description
      properties:
        code:
          type: string
        weight:
          type: integer
        description:
          type: string

    EvaluateResponse:
      type: object
      required:
        - event_id
        - decision
        - risk_score
        - triggered_rules
        - degraded_mode
        - evaluation_time_ms
      properties:
        event_id:
          type: string
        decision:
          $ref: '#/components/schemas/DecisionAction'
        risk_score:
          type: integer
          minimum: 0
        triggered_rules:
          type: array
          items:
            $ref: '#/components/schemas/TriggeredRuleDetail'
        shadow_triggered_rules:
          type: array
          items:
            type: string
        degraded_mode:
          type: boolean
          description: True when Redis velocity checks were skipped due to timeout/unavailability (Fail-Open).
        evaluation_time_ms:
          type: number
          format: float

    Condition:
      type: object
      required:
        - field
        - operator
        - value
      properties:
        field:
          type: string
          example: "amount"
        operator:
          $ref: '#/components/schemas/Operator'
        value:
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                oneOf:
                  - type: string
                  - type: number

    VelocityConfig:
      type: object
      required:
        - group_by
        - window_seconds
      properties:
        group_by:
          type: string
          enum: [user_id, ip_address, device_id]
        window_seconds:
          type: integer
          minimum: 1
          maximum: 86400
          example: 300

    CreateRuleRequest:
      type: object
      required:
        - code
        - name
        - type
        - status
        - weight
        - condition
      properties:
        code:
          type: string
          pattern: '^[A-Z0-9_]+$'
          example: "HIGH_AMOUNT_BRL"
        name:
          type: string
        description:
          type: string
        type:
          $ref: '#/components/schemas/RuleType'
        status:
          $ref: '#/components/schemas/RuleStatus'
        weight:
          type: integer
          minimum: 1
          maximum: 100
        condition:
          $ref: '#/components/schemas/Condition'
        velocity_config:
          $ref: '#/components/schemas/VelocityConfig'

    Rule:
      allOf:
        - $ref: '#/components/schemas/CreateRuleRequest'
        - type: object
          required:
            - id
            - created_at
            - updated_at
          properties:
            id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    SimulateRuleRequest:
      type: object
      required:
        - sample_size
        - candidate_rule
      properties:
        sample_size:
          type: integer
          minimum: 10
          maximum: 10000
          default: 1000
        candidate_rule:
          $ref: '#/components/schemas/CreateRuleRequest'

    SimulateRuleResponse:
      type: object
      required:
        - events_analyzed
        - matched_events
        - match_rate_percent
        - new_blocks_count
      properties:
        events_analyzed:
          type: integer
        matched_events:
          type: integer
        match_rate_percent:
          type: number
          format: float
        new_blocks_count:
          type: integer

    ProblemDetails:
      type: object
      description: RFC 7807 / RFC 9457 Problem Details for HTTP APIs
      required:
        - type
        - title
        - status
        - detail
      properties:
        type:
          type: string
          format: uri
          example: "https://api.fraud-engine.dev/errors/validation-error"
        title:
          type: string
          example: "Invalid Request Payload"
        status:
          type: integer
          example: 400
        detail:
          type: string
          example: "Field 'amount' must be greater than or equal to 0"
        instance:
          type: string
